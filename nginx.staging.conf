worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    # Upstream — Docker DNS resolves `api` inside the edutech-staging network only
    upstream api {
        server api:3001;
    }

    # ── HTTP → HTTPS redirect: fixed-target allowlist (STAGING ONLY) ─────────
    # The redirect destination is a LITERAL for each allowlisted name — the
    # request's Host header can only select one of the two pinned targets or be
    # refused. Only Hosts matching the certificate SANs (IP:192.168.0.188,
    # DNS:localhost) may receive a redirect; 127.0.0.1 is intentionally
    # excluded (not in the cert SANs). Any other Host receives 421 Misdirected
    # Request with NO Location header. Production nginx.conf is untouched.
    server {
        listen 80 default_server;
        server_name _;
        return 421;
    }
    server {
        listen 80;
        server_name 192.168.0.188;
        return 301 https://192.168.0.188:8443$request_uri;
    }
    server {
        listen 80;
        server_name localhost;
        return 301 https://localhost:8443$request_uri;
    }

    # HTTPS server (kept at production parity for this gate)
    # DOCUMENTED RESIDUAL (owner decision: parity, no 421 restriction here):
    # this single server is the implicit default for ANY Host on 443 —
    # unrecognized Host values still receive the SPA and the /api proxy.
    # The API's Origin middleware (commit 9042427) independently gates login.
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        # STAGING DIFF: HSTS intentionally omitted (host-scoped; staging must
        # not set browser state for 192.168.0.188). Production sends its own.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend — served from dist-staging/ (mounted read-only)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints — stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://api/health;
        }
    }
}

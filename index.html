    <script>
      // Remove the splash as soon as React has rendered something into #root
      (function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        var root = document.getElementById('root');
        var observer = new MutationObserver(function () {
          if (root && root.firstChild && root.firstChild !== splash) {
            splash.remove();
            observer.disconnect();
          }
        });
        if (root) observer.observe(root, { childList: true });
        // Safety: never let the splash linger longer than 6s
        setTimeout(function () { splash.remove(); observer.disconnect(); }, 6000);
      })();
    </script>
